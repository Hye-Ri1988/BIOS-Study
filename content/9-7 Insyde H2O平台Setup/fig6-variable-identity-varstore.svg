<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="v1" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2f6f8f"/>
    </marker>
    <marker id="v2" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7a4a12"/>
    </marker>
  </defs>
  <rect width="1240" height="920" fill="#f7f8fa"/>
  <text x="620" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1b2b3a">UEFI 变量身份 · varstore 绑定 · attribute 属性</text>
  <text x="620" y="68" text-anchor="middle" font-size="14" fill="#5b6b7b">一个 UEFI 变量靠「名字 + GUID + attribute」三位一体被定位、存取、持久化</text>

  <!-- identity box -->
  <rect x="120" y="110" width="1000" height="110" rx="14" fill="#eef2f7" stroke="#2f6f8f" stroke-width="2.4"/>
  <text x="620" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e6b">变量完整身份（三位一体）</text>
  <rect x="140" y="160" width="200" height="44" rx="8" fill="#ffffff" stroke="#4a8fbd"/>
  <text x="240" y="188" text-anchor="middle" font-size="13" fill="#1f4e6b">名字 L"JYTianSetupVar"（UTF-16）</text>
  <rect x="360" y="160" width="240" height="44" rx="8" fill="#ffffff" stroke="#4a8fbd"/>
  <text x="480" y="188" text-anchor="middle" font-size="13" fill="#1f4e6b">GUID = JY_TIAN_SETUP_VARSTORE_GUID</text>
  <rect x="620" y="160" width="220" height="44" rx="8" fill="#ffffff" stroke="#b5652f"/>
  <text x="730" y="188" text-anchor="middle" font-size="13" fill="#7a4a12">attribute = 0x00000007</text>

  <!-- Get/SetVariable -->
  <rect x="120" y="270" width="1000" height="90" rx="14" fill="#eaf3ec" stroke="#3b8269" stroke-width="2"/>
  <text x="620" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#1f4e3a">GetVariable / SetVariable（UEFI Runtime Services）</text>
  <text x="620" y="326" text-anchor="middle" font-size="13" fill="#33475b">gRT-&gt;GetVariable(名字, &amp;GUID, NULL, &amp;Size, &amp;mJYTianSetupConfig)</text>
  <text x="620" y="348" text-anchor="middle" font-size="13" fill="#33475b">gRT-&gt;SetVariable(名字, &amp;GUID, JY_TIAN_SETUP_VAR_ATTRIBUTES, Size, &amp;mJYTianSetupConfig)</text>

  <!-- attribute bits -->
  <rect x="120" y="400" width="610" height="250" rx="14" fill="#fdf4e7" stroke="#b5652f" stroke-width="2"/>
  <text x="425" y="432" text-anchor="middle" font-size="17" font-weight="700" fill="#7a4a12">attribute 三个位（按位或 = 0x7）</text>

  <rect x="140" y="452" width="180" height="80" rx="8" fill="#ffffff" stroke="#b5652f"/>
  <text x="230" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4a12">0x01</text>
  <text x="230" y="498" text-anchor="middle" font-size="11" fill="#33475b">NON_VOLATILE</text>
  <text x="230" y="518" text-anchor="middle" font-size="11" fill="#5b6b7b">存非易失 Flash，断电不丢</text>

  <rect x="340" y="452" width="180" height="80" rx="8" fill="#ffffff" stroke="#b5652f"/>
  <text x="430" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4a12">0x02</text>
  <text x="430" y="498" text-anchor="middle" font-size="11" fill="#33475b">BOOTSERVICE_ACCESS</text>
  <text x="430" y="518" text-anchor="middle" font-size="11" fill="#5b6b7b">开机阶段固件可读写</text>

  <rect x="540" y="452" width="180" height="80" rx="8" fill="#ffffff" stroke="#b5652f"/>
  <text x="630" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4a12">0x04</text>
  <text x="630" y="498" text-anchor="middle" font-size="11" fill="#33475b">RUNTIME_ACCESS</text>
  <text x="630" y="518" text-anchor="middle" font-size="11" fill="#5b6b7b">OS 接管后仍可读写</text>

  <text x="425" y="580" text-anchor="middle" font-size="14" font-weight="600" fill="#7a4a12">attribute 告诉固件“怎么存储、谁能访问”</text>
  <text x="425" y="608" text-anchor="middle" font-size="12" fill="#5b6b7b">NVRAM 变量默认用这 3 位；配置必须 NON_VOLATILE。</text>

  <!-- struct binding -->
  <rect x="770" y="400" width="360" height="250" rx="14" fill="#eaf1f7" stroke="#4a8fbd" stroke-width="2"/>
  <text x="950" y="432" text-anchor="middle" font-size="17" font-weight="700" fill="#1f4e6b">varstore ↔ struct 绑定（2 字节）</text>
  <text x="950" y="460" text-anchor="middle" font-size="12" fill="#33475b">efivarstore JY_TIAN_SETUP_CONFIGURATION</text>
  <rect x="800" y="480" width="150" height="44" rx="6" fill="#ffffff" stroke="#4a8fbd"/>
  <text x="875" y="507" text-anchor="middle" font-size="12" fill="#1f4e6b">EnableFlag · 偏移0</text>
  <rect x="970" y="480" width="150" height="44" rx="6" fill="#ffffff" stroke="#4a8fbd"/>
  <text x="1045" y="507" text-anchor="middle" font-size="12" fill="#1f4e6b">DemoMode · 偏移1</text>
  <text x="950" y="560" text-anchor="middle" font-size="12" fill="#33475b">#pragma pack(1) → 紧凑 2 字节</text>
  <text x="950" y="582" text-anchor="middle" font-size="12" fill="#33475b">NVRAM 变量 / IFR varstore / struct 三者字节布局严格一致</text>

  <!-- arrows identity -> get/set ; get/set -> struct/attrs -->
  <g stroke="#2f6f8f" stroke-width="2.2" fill="none">
    <path d="M620 220 L620 270" marker-end="url(#v1)"/>
    <path d="M240 360 L240 400" marker-end="url(#v1)"/>
    <path d="M950 360 L950 400" marker-end="url(#v1)"/>
  </g>

  <text x="620" y="720" text-anchor="middle" font-size="13" fill="#5b6b7b">变量名的宽字符串（L“...”）= UTF-16，UEFI 变量名/字符串 API 都用它；变量完整身份 = 名字 + GUID。</text>
  <text x="620" y="752" text-anchor="middle" font-size="12" fill="#8a94a0">HiiConstructConfigHdr 用 formset GUID + 变量名 + 设备路径生成配置字符串前段（GUID=...&amp;NAME=...&amp;PATH=...）。</text>
  <text x="620" y="784" text-anchor="middle" font-size="12" fill="#8a94a0">GLOBAL_REMOVE_IF_UNREFERENCED：两个 GUID 用 EFI_GUID 全局变量存，是为了能取地址 &amp;xxx 传给要 EFI_GUID* 的 API。</text>
</svg>
