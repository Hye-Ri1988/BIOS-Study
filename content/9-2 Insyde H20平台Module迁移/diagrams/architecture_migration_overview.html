<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagram Preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.08), transparent 35%),
        #f5f7fb;
    }
    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .quota-hint {
      font-size: 13px;
      color: #4b5563;
      margin: 0;
      text-align: center;
    }
    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      cursor: pointer;
    }
    .feedback-button {
      background: #16a34a;
      border-color: #15803d;
      color: #ffffff;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
      width: 100%;
    }
    .tab-button {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #374151;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .tab-button:hover {
      background: #f3f4f6;
    }
    .tab-button.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }
    .canvas {
      width: min(96vw, 1600px);
      max-height: calc(100vh - 140px);
      padding: 24px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
      overflow: auto;
      display: flex;
      flex-direction: column;
    }
    .tab-content {
      display: none;
      width: 100%;
    }
    .tab-content.active {
      display: block;
    }
    .canvas svg {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }
    .deep-edit-panel {
      display: flex;
      gap: 12px;
      width: min(96vw, 1600px);
      align-items: center;
    }
    .deep-edit-panel input {
      flex: 1;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      font-size: 14px;
      color: #111827;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .deep-edit-panel input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .deep-edit-submit {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #ffffff;
      white-space: nowrap;
    }
    .deep-edit-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .deep-edit-error {
      width: min(96vw, 1600px);
      margin: 0;
      font-size: 13px;
      color: #dc2626;
      display: none;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-dialog {
      width: min(92vw, 420px);
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.24);
    }
    .modal-dialog h3 {
      margin: 0;
      font-size: 16px;
      color: #111827;
    }
    .modal-desc {
      margin: 0;
      font-size: 13px;
      color: #4b5563;
    }
    .modal-dialog input {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }
    .modal-dialog input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .modal-status {
      margin: 0;
      font-size: 13px;
      min-height: 18px;
    }
    .modal-status.ok {
      color: #16a34a;
    }
    .modal-status.err {
      color: #dc2626;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
    }
    .modal-actions button {
      flex: 1;
      min-height: 36px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-actions button.primary {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #ffffff;
    }
    .modal-link {
      font-size: 13px;
      color: #3b82f6;
      text-decoration: none;
    }
  </style>
</head>

  <script>
    (function () {
      const downloadButton = document.getElementById("download-svg-button");
      const canvas = document.querySelector(".canvas");
      if (!downloadButton || !canvas) {
        return;
      }
      
      const tabButtons = document.querySelectorAll(".tab-button");
      const tabContents = document.querySelectorAll(".tab-content");
      
      tabButtons.forEach(button => {
        button.addEventListener("click", () => {
          tabButtons.forEach(btn => btn.classList.remove("active"));
          tabContents.forEach(content => content.classList.remove("active"));
          
          button.classList.add("active");
          const targetId = button.getAttribute("data-target");
          const targetContent = document.getElementById(targetId);
          if (targetContent) {
            targetContent.classList.add("active");
          }
        });
      });

      downloadButton.addEventListener("click", function () {
        let svg = null;
        if (tabContents.length > 0) {
          const activeContent = document.querySelector(".tab-content.active");
          if (activeContent) {
            svg = activeContent.querySelector("svg");
          }
        } else {
          svg = canvas.querySelector("svg");
        }
        
        if (!svg) {
          window.alert("当前页面未找到可导出的 SVG");
          return;
        }
        const serializer = new XMLSerializer();
        let svgSource = serializer.serializeToString(svg);
        if (!svgSource.includes("xmlns=")) {
          svgSource = svgSource.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg"');
        }
        if (!svgSource.includes("xmlns:xlink=")) {
          svgSource = svgSource.replace("<svg", '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
        }
        const blob = new Blob([svgSource], { type: "image/svg+xml;charset=utf-8" });
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = blobUrl;
        
        let dlName = "diagram-dac0d8b1-9741-41cc-8f80-d47886e73294.svg";
        if (tabContents.length > 0) {
          const activeBtn = document.querySelector(".tab-button.active");
          if (activeBtn) {
            dlName = dlName.replace(".svg", "-" + activeBtn.textContent.trim() + ".svg");
          }
        }
        link.download = dlName;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      });
    })();
  </script>

      function closeModal() {

      }

        }).then(function (resp) {
          if (resp.ok) {
            setKeyStatus("校验通过", true);
          } else {
            setKeyStatus("校验失败，请检查 Key", false);
          }
        }).catch(function () {
          setKeyStatus("校验失败，请检查网络", false);
        });
      });

      saveButton.addEventListener("click", function () {
        var key = keyInput.value.trim();
        if (!key) {
          setKeyStatus("请输入 Key", false);
          return;
        }
        localStorage.setItem(API_KEY_STORAGE_KEY, key);
        setKeyStatus("已保存到浏览器本地", true);
      });

      editButton.addEventListener("click", function () {
        var instruction = editInput.value.trim();
        if (!instruction) {
          showEditError("请先描述你想如何修改这张图");
          return;
        }
        if (!CW_SESSION_ID) {
          showEditError("当前页面缺少 session_id，无法进行深度编辑");
          return;
        }
        var key = localStorage.getItem(API_KEY_STORAGE_KEY);
        if (!key) {
          openModal();
          setKeyStatus("请先配置并保存 API Key", false);
          return;
        }
        hideEditError();
        editButton.disabled = true;
        editButton.textContent = "生成中…";
        fetch(EDIT_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-User-API-Key": key
          },
          body: JSON.stringify({ session_id: CW_SESSION_ID, instruction: instruction })
        }).then(function (resp) {
          return resp.json().then(function (data) {
            if (!resp.ok) {
              var detail = (data && data.detail) ? data.detail : ("请求失败（HTTP " + resp.status + "）");
              throw new Error(detail);
            }
            return data;
          });
        }).then(function (data) {
          if (!data || !data.svg) {
            throw new Error("响应中缺少 svg 内容");
          }
          var activeTab = document.querySelector(".tab-content.active");
          var target = activeTab || document.querySelector(".canvas");
          target.innerHTML = data.svg;
          hideEditError();
        }).catch(function (err) {
          showEditError(err.message || "深度编辑失败，请稍后重试");
        }).finally(function () {
          editButton.disabled = false;
          editButton.textContent = "深度编辑";
        });
      });
    })();
  </script>
</body>
</html>
